<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4 bg-light">

    <h1 class="text-center text-warning">✏️ Edit Expense</h1>

    <form action="/edit/{{ expense[0] }}" method="post" class="bg-white p-4 rounded shadow">
        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense[2] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" value="{{ expense[3] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" name="description" class="form-control" value="{{ expense[4] }}">
        </div>
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </form>

</body>
</html>
