<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="container mt-4 bg-light">

    <h1 class="text-center mb-4 text-primary">💰 Expense Tracker</h1>

    <!-- Add Expense Form -->
    <form action="/add" method="post" class="row g-3 bg-white p-3 rounded shadow">
        <div class="col-md-3">
            <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required>
        </div>
        <div class="col-md-3">
            <input type="text" name="category" class="form-control" placeholder="Category" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="description" class="form-control" placeholder="Description">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Add Expense</button>
        </div>
    </form>

    <!-- Expense Log -->
    <h2 class="mt-5 text-secondary">📒 Expense Log</h2>
    <table class="table table-hover table-bordered bg-white shadow">
        <thead class="table-dark">
            <tr>
                <th>Date</th><th>Amount</th><th>Category</th><th>Description</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for exp in expenses %}
            <tr>
                <td>{{ exp[1] }}</td>
                <td class="text-danger fw-bold">₹{{ exp[2] }}</td>
                <td>{{ exp[3] }}</td>
                <td>{{ exp[4] }}</td>
                <td>
                    <a href="/edit/{{ exp[0] }}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="/delete/{{ exp[0] }}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Report -->
    <h2 class="mt-5 text-info">📊 Report</h2>
    <p><strong>Total Spent:</strong> ₹{{ total }}</p>
    <canvas id="expenseChart" width="400" height="200"></canvas>

    <script>
        const ctx = document.getElementById('expenseChart').getContext('2d');
        const expenseChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: [{% for cat in categories.keys() %}'{{ cat }}',{% endfor %}],
                datasets: [{
                    data: [{% for amt in categories.values() %}{{ amt }},{% endfor %}],
                    backgroundColor: ['#ff6384','#36a2eb','#ffce56','#4bc0c0','#9966ff','#ff9f40']
                }]
            }
        });
    </script>

</body>
</html>
